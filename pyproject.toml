[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wealth-gini-atlas"
version = "0.4.0"
description = "Open, citable, extensible panel of household net wealth inequality across countries and regions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wealth Gini Atlas contributors" }]
keywords = ["inequality", "wealth", "gini", "economics", "WID", "HFCS", "SCF", "DFA", "LWS"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy>=1.24",
    "requests>=2.30",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
wga = "wealth_gini_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/conway1521/wealth_ineq"
Issues = "https://github.com/conway1521/wealth_ineq/issues"

[tool.setuptools.packages.find]
include = ["wealth_gini_atlas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
