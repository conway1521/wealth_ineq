name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -ra
      - name: Build release from fixtures
        run: |
          mkdir -p data/release
          WGA_WID_LOCAL=data/fixtures wga build --out-dir data/release --version 0.1.0-fixtures
          wga validate data/release/wealth_gini_atlas_v0.1.0-fixtures.csv
      - name: Upload fixture release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-gini-atlas-fixture-release
          path: data/release/
