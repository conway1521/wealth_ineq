name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -ra
      - name: Build release from fixtures
        run: |
          mkdir -p data/release
          WGA_WID_LOCAL=data/fixtures wga build --out-dir data/release --version 0.1.0-fixtures
          wga validate data/release/wealth_gini_atlas_v0.1.0-fixtures.csv
      - name: Upload fixture release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wealth-gini-atlas-fixture-release
          path: data/release/

  pages:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
